name: Import source repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy public source repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kavyaBAI/suga-health.git /tmp/suga-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/suga-source/ ./
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Duplicate kavyaBAI/suga-health into sugav1"
          git push origin main
